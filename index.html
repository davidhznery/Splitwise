<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split Wise | Shared Expenses Tracker</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-animation"></div>
    <div class="container">
        <header class="app-header">
            <div class="logo">
                <i class="fas fa-wallet"></i>
            </div>
            <h1>Split Wise</h1>
            <p>Seamlessly manage shared expenses</p>
        </header>

        <main class="app-grid">
            <!-- Left Column: Inputs & Actions -->
            <div class="column input-column">
                
                <section class="total-expense-section glass-card glowing-card">
                    <div class="total-expense-content">
                        <div class="expense-info">
                            <h3>Total Spent</h3>
                            <p id="totalSpent">$0.00</p>
                        </div>
                        <div class="expense-icon">
                            <i class="fas fa-chart-line"></i>
                        </div>
                    </div>
                </section>

                <section class="people-section glass-card">
                    <div class="section-header">
                        <h2><i class="fas fa-users"></i> People</h2>
                    </div>
                    <div class="input-group">
                        <input type="text" id="personName" placeholder="Enter name">
                        <button id="addPerson" class="btn-primary"><i class="fas fa-user-plus"></i> Add</button>
                    </div>
                    <ul id="peopleList" class="custom-list"></ul>
                </section>

                <section class="expense-section glass-card">
                    <div class="section-header">
                        <h2><i class="fas fa-file-invoice-dollar"></i> Add Expense</h2>
                    </div>
                    <div class="form-container">
                        <input type="number" id="expenseAmount" placeholder="Amount ($)" min="0" step="0.01">
                        <input type="text" id="expenseDescription" placeholder="What was this for?">
                        
                        <div class="select-wrapper">
                            <select id="payer">
                                <option value="">Who paid?</option>
                            </select>
                            <i class="fas fa-chevron-down"></i>
                        </div>

                        <div id="splitOptions" class="split-toggle">
                            <label class="radio-label">
                                <input type="radio" name="splitType" value="equal" checked>
                                <span class="radio-custom">Split Equally</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="splitType" value="custom">
                                <span class="radio-custom">Custom Split</span>
                            </label>
                        </div>
                        
                        <div id="customSplit" class="custom-split-container"></div>
                        
                        <button id="addExpense" class="btn-primary btn-full"><i class="fas fa-plus-circle"></i> Add Expense</button>
                    </div>
                </section>

                <section class="payment-section glass-card">
                    <div class="section-header">
                        <h2><i class="fas fa-handshake"></i> Settle Up</h2>
                    </div>
                    <div class="form-container">
                        <input type="number" id="paymentAmount" placeholder="Amount ($)" min="0" step="0.01">
                        <input type="text" id="paymentDescription" placeholder="Payment Note/Method (optional)">
                        
                        <div class="select-row">
                            <div class="select-wrapper half">
                                <select id="payerPayment">
                                    <option value="">Paid By</option>
                                </select>
                                <i class="fas fa-chevron-down"></i>
                            </div>
                            <div class="select-icon"><i class="fas fa-arrow-right"></i></div>
                            <div class="select-wrapper half">
                                <select id="receiverPayment">
                                    <option value="">Paid To</option>
                                </select>
                                <i class="fas fa-chevron-down"></i>
                            </div>
                        </div>
                        
                        <button id="addPayment" class="btn-secondary btn-full"><i class="fas fa-paper-plane"></i> Record Payment</button>
                    </div>
                </section>
            </div>

            <!-- Right Column: Results & Balances -->
            <div class="column result-column">
                <section class="balances-section glass-card flex-grow">
                    <div class="section-header">
                        <h2><i class="fas fa-balance-scale"></i> Timeline & Balances</h2>
                    </div>
                    <ul id="balancesList" class="custom-list history-list"></ul>
                </section>

                <section class="debts-section glass-card flex-grow">
                    <div class="section-header">
                        <h2><i class="fas fa-money-bill-wave"></i> Who Owes Who</h2>
                    </div>
                    <ul id="debtsList" class="custom-list debts-list"></ul>
                </section>
            </div>
        </main>
    </div>
    <script src="scripts.js"></script>
</body>
</html>
